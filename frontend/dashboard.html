<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZHU STOCK DASHBOARD</title>

<style>

body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial;
}

.header{
    padding:20px;
    background:#111827;
    font-size:28px;
    font-weight:bold;
}

.container{
    padding:20px;
}

.card{
    background:#1e293b;
    border-radius:20px;
    padding:20px;
    margin-bottom:20px;
}

.btn{
    width:100%;
    border:none;
    padding:15px;
    border-radius:12px;
    background:#22c55e;
    color:white;
    font-size:18px;
    cursor:pointer;
    margin-top:15px;
}

</style>

</head>

<body>

<div class="header">
ZHU STOCK APP
</div>

<div class="container">

<div class="card">

<h2 id="welcome"></h2>

<div>
手機版 / Web版 控制台
</div>

<button class="btn" onclick="window.location.href='bullish.html'">
看多選股池
</button>

<button class="btn" onclick="window.location.href='bearish.html'">
看空選股池
</button>

<button class="btn" onclick="window.location.href='warrants.html'">
權證專區
</button>

<button class="btn" onclick="window.location.href='holdings.html'">
我的持股
</button>

<button class="btn" onclick="window.location.href='users.html'">
會員管理
</button>

<button class="btn" onclick="window.location.href='payments.html'">
付款審核
</button>

<button class="btn" onclick="window.location.href='referral.html'">
推薦制度
</button>

<button class="btn" onclick="window.location.href='feedback.html'">
用戶回饋
</button>

<button class="btn" onclick="runCloudAnalysis()">
雲端分析
</button>

</div>

</div>

<script>

const username =
    localStorage.getItem("username");

document.getElementById("welcome").innerHTML =
    "歡迎回來：" + username;

</script>
<script>

async function runCloudAnalysis(){

    alert("開始雲端分析...");

    try{

        const res = await fetch(
        "https://zhu-stock-app.onrender.com/run-analysis"
        );

        const data = await res.json();

        alert(
            "分析完成\n"+
            "看多股票數："+data.count
        );

    }catch(err){

        alert("雲端分析失敗");

    }

}

</script>
</body>
</html>
