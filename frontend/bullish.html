<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>看多選股池</title>

<style>
body{
  margin:0;
  background:#0f172a;
  color:white;
  font-family:Arial;
}

.header{
  padding:20px;
  background:#111827;
  font-size:28px;
  font-weight:bold;
}

.container{
  padding:20px;
}

.card{
  background:#1e293b;
  border-radius:20px;
  padding:20px;
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  border-bottom:1px solid #334155;
  padding:12px;
  text-align:left;
}

th{
  color:#93c5fd;
}

.back{
  width:100%;
  margin-top:20px;
  padding:15px;
  border:none;
  border-radius:12px;
  background:#22c55e;
  color:white;
  font-size:18px;
  cursor:pointer;
}

.loading{
  padding:20px;
  color:#cbd5e1;
}
</style>
</head>

<body>

<div class="header">
看多選股池
</div>

<div class="container">

  <div class="card">

    <table id="table">

      <tr>
        <th>股票代號</th>
        <th>股票名稱</th>
        <th>星等</th>
        <th>StrongScore</th>
        <th>乖離率%</th>
      </tr>

      <tr>
        <td colspan="5" class="loading">
          資料載入中...
        </td>
      </tr>

    </table>

  </div>

  <button class="back"
  onclick="window.location.href='dashboard.html'">
    返回後台
  </button>

</div>

<script>

const API =
"https://zhu-stock-app.onrender.com";

async function loadStocks(){

  try{

    const res = await fetch(
      API + "/stocks/bullish"
    );

    const data = await res.json();

    const items = data.items || [];

    let html = `
    <tr>
      <th>股票代號</th>
      <th>股票名稱</th>
      <th>星等</th>
      <th>StrongScore</th>
      <th>乖離率%</th>
    </tr>
    `;

    if(items.length === 0){

      html += `
      <tr>
        <td colspan="5">
          目前沒有資料
        </td>
      </tr>
      `;

    }else{

      items.forEach(stock=>{

        html += `
        <tr>
          <td>${stock.stock_id || "-"}</td>
          <td>${stock.name || "-"}</td>
          <td>${stock.stars || "-"}</td>
          <td>${stock.strong_score || "-"}</td>
          <td>${stock.bias || "-"}</td>
        </tr>
        `;

      });

    }

    document.getElementById("table").innerHTML = html;

  }catch(err){

    document.getElementById("table").innerHTML = `
      <tr>
        <td colspan="5">
          API連線失敗
        </td>
      </tr>
    `;

    console.error(err);

  }

}

loadStocks();

</script>

</body>
</html>
