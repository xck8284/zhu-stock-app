<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>看多選股池</title>

<style>
body{
  margin:0;
  background:#0f172a;
  color:white;
  font-family:Arial;
}

.header{
  padding:20px;
  background:#111827;
  font-size:28px;
  font-weight:bold;
}

.container{
  padding:20px;
}

.card{
  background:#1e293b;
  border-radius:20px;
  padding:20px;
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  border-bottom:1px solid #334155;
  padding:12px;
  text-align:left;
}

th{
  color:#93c5fd;
}

.back{
  width:100%;
  margin-top:20px;
  padding:15px;
  border:none;
  border-radius:12px;
  background:#22c55e;
  color:white;
  font-size:18px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
看多選股池
</div>

<div class="container">

  <div class="card">

    <table>
      <tr>
        <th>股票代號</th>
        <th>股票名稱</th>
        <th>星等</th>
        <th>StrongScore</th>
        <th>乖離率%</th>
      </tr>

      <tr>
        <td>2330</td>
        <td>台積電</td>
        <td>★★★★★</td>
        <td>128</td>
        <td>12%</td>
      </tr>

      <tr>
        <td>3017</td>
        <td>奇鋐</td>
        <td>★★★★☆</td>
        <td>115</td>
        <td>18%</td>
      </tr>

    </table>

  </div>

  <button class="back"
  onclick="window.location.href='dashboard.html'">
    返回後台
  </button>

</div>

</body>
</html>
