<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>付款審核</title>
<style>
body{margin:0;background:#0f172a;color:white;font-family:Arial}
.header{padding:20px;background:#111827;font-size:28px;font-weight:bold}
.container{padding:20px}
.card{background:#1e293b;border-radius:20px;padding:20px;margin-bottom:20px}
.btn{width:100%;border:none;padding:15px;border-radius:12px;background:#22c55e;color:white;font-size:18px;cursor:pointer;margin-top:15px}
</style>
</head>
<body>

<div class="header">付款審核</div>

<div class="container">
  <div class="card">
    <h2>付款回報列表</h2>
    <div id="list">載入中...</div>
  </div>

  <button class="btn" onclick="window.location.href='dashboard.html'">
    返回後台
  </button>
</div>

<script>
async function loadPayments(){
  const token = localStorage.getItem("token");

  const res = await fetch("https://zhu-stock-app.onrender.com/admin/payment-reports", {
    method: "GET",
    headers: {
      "Authorization": "Bearer " + token
    }
  });

  const data = await res.json();
  console.log(data);

  document.getElementById("list").innerHTML =
    "<pre>" + JSON.stringify(data, null, 2) + "</pre>";
}

loadPayments();
</script>

</body>
</html>
