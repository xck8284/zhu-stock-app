<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZHU STOCK APP</title>

<style>

body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial;
}

.container{
    padding:30px;
}

.title{
    font-size:32px;
    font-weight:bold;
    margin-bottom:10px;
}

.subtitle{
    color:#94a3b8;
    margin-bottom:30px;
}

.card{
    background:#1e293b;
    border-radius:20px;
    padding:20px;
    margin-bottom:20px;
}

.btn{
    width:100%;
    border:none;
    padding:15px;
    border-radius:12px;
    background:#22c55e;
    color:white;
    font-size:18px;
    cursor:pointer;
    margin-top:15px;
}

input{
    width:100%;
    padding:15px;
    border-radius:12px;
    border:none;
    margin-top:10px;
    background:#334155;
    color:white;
    box-sizing:border-box;
}

</style>

</head>

<body>

<div class="container">

    <div class="title">
        ZHU STOCK APP
    </div>

    <div class="subtitle">
        手機版 / Web版 雲端選股系統
    </div>

    <div class="card">

        <h2>會員登入</h2>

        <input
            id="account"
            placeholder="帳號或Email"
        >

        <input
            id="password"
            type="password"
            placeholder="密碼"
        >

        <button
            class="btn"
            onclick="login()"
        >
            登入
        </button>

    </div>

    <div class="card">

        <h2>系統狀態</h2>

        <div id="status">
            尚未登入
        </div>

    </div>

</div>

<script>

async function login(){

    const account =
        document.getElementById("account").value;

    const password =
        document.getElementById("password").value;

    try{

        const res = await fetch(
            "https://zhu-stock-app.onrender.com/login",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    account:account,
                    password:password
                })
            }
        );

        const data = await res.json();

        console.log(data);

        if(data.success){

            localStorage.setItem(
                "token",
                data.access_token
            );

            localStorage.setItem(
                "username",
                data.username
            );

            document.getElementById("status").innerHTML =
                "登入成功：" + data.username;

            window.location.href =
                "dashboard.html";

        }else{

            document.getElementById("status").innerHTML =
                "登入失敗";

        }

    }catch(err){

        console.log(err);

        document.getElementById("status").innerHTML =
            "系統錯誤";

    }

}

</script>

</body>
</html>
