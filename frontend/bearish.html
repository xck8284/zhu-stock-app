<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>看空選股池</title>

<style>
body{
  margin:0;
  background:#0f172a;
  color:white;
  font-family:Arial;
}

.header{
  padding:20px;
  background:#111827;
  font-size:28px;
  font-weight:bold;
}

.container{
  padding:20px;
}

.card{
  background:#1e293b;
  border-radius:20px;
  padding:20px;
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  border-bottom:1px solid #334155;
  padding:12px;
  text-align:left;
}

th{
  color:#93c5fd;
}

.back{
  width:100%;
  margin-top:20px;
  padding:15px;
  border:none;
  border-radius:12px;
  background:#22c55e;
  color:white;
  font-size:18px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
看空選股池
</div>

<div class="container">

  <div class="card">

    <table id="table">
      <tr>
        <th>股票代號</th>
        <th>股票名稱</th>
        <th>星等</th>
        <th>StrongScore</th>
        <th>乖離率%</th>
      </tr>
    </table>

  </div>

  <button class="back"
  onclick="window.location.href='dashboard.html'">
    返回後台
  </button>

</div>

<script>

async function loadData(){

  try{

    const res = await fetch(
      "https://zhu-stock-app.onrender.com/bearish"
    );

    const data = await res.json();

    const table = document.getElementById("table");

    data.items.forEach(item=>{

      table.innerHTML += `
      <tr>
        <td>${item.stock_id}</td>
        <td>${item.name}</td>
        <td>${item.stars}</td>
        <td>${item.strong_score}</td>
        <td>${item.bias}</td>
      </tr>
      `;

    });

  }catch(e){

    document.getElementById("table").innerHTML += `
    <tr>
      <td colspan="5">
        API連線失敗
      </td>
    </tr>
    `;

  }

}

loadData();

</script>

</body>
</html>
